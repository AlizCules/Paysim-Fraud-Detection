name: CI

on:
  push:
    branches: [main, methodology-portfolio-polish]
  pull_request:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn pytest
      - name: Compile source
        run: python -m compileall -q src scripts tests run_pipeline.py
      - name: Run integrity tests
        run: python -m pytest -q
